name: Deploy Production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "production"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Aliyun ECS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'production' }}

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Sync and deploy
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'logs/' \
            --exclude 'backups/' \
            --exclude '.env' \
            --exclude '*.db' \
            --exclude 'backend/uploads/' \
            --exclude 'backend/__pycache__/' \
            --exclude 'backend/.pytest_cache/' \
            -e "ssh -p $ECS_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            ./ "$ECS_USER@$ECS_HOST:/root/coding-platform/"

          ssh -p "$ECS_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            "$ECS_USER@$ECS_HOST" \
            "cd /root/coding-platform && bash deploy/ubuntu/deploy.sh"
